name: IronTV
options:
  bundleIdPrefix: com.taunais
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  # VLC fallback decoder for channels AVPlayer can't play on iOS/tvOS
  # (MP2 audio, interlaced video). Binary SPM wrapper of official VLCKit.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    # App Store distribution on all platforms. Automatic signing lets Xcode
    # pick Apple Development for Debug and Apple Distribution for archives.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5NP3LPSUMR
targets:
  IronTV:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          - "*.entitlements"
      - path: LICENSE
        buildPhase: resources
      - path: Credits.rtf
        buildPhase: resources
    dependencies:
      - package: VLCKitSPM
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: IronTV
        CFBundleDisplayName: IronTV
        # Flip to true once the iCloud KVS entitlement is provisioned.
        IronTVCloudKVSEnabled: false
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "17"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar. All rights reserved."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.video
        NSAppTransportSecurity:
          # Provider host is entered by the user at runtime, so a per-host
          # ATS exception is impossible. IPTV panels serve plain HTTP.
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Sources/IronTV.entitlements
      properties:
        # App Sandbox is mandatory for the Mac App Store. network.client
        # allows outgoing connections to the IPTV server and sample streams.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.irontv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - IronTVTests
  IronTV-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          - "*.entitlements"
      - path: LICENSE
        buildPhase: resources
    info:
      path: Sources/Info-iOS.plist
      properties:
        CFBundleName: IronTV
        CFBundleDisplayName: IronTV
        # iCloud settings-sync deferred to a 1.1 update (needs the App ID's
        # iCloud container fully provisioned); off for the 1.0 submission.
        IronTVCloudKVSEnabled: false
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "17"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar. All rights reserved."
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.irontv
        PRODUCT_NAME: IronTV
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode manages iOS provisioning profiles (device installs) itself.
        CODE_SIGN_STYLE: Automatic
  IronTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          - "*.entitlements"
      - path: LICENSE
        buildPhase: resources
    info:
      path: Sources/Info-tvOS.plist
      properties:
        CFBundleName: IronTV
        CFBundleDisplayName: IronTV
        IronTVCloudKVSEnabled: false
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "17"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar. All rights reserved."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.irontv
        PRODUCT_NAME: IronTV
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  IronTVTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IronTVTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: IronTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.irontv.tests
        GENERATE_INFOPLIST_FILE: true
