name: IronTV
options:
  bundleIdPrefix: com.quantkernel
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
    tvOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: 5NP3LPSUMR
targets:
  IronTV:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          - "*.entitlements"
      - path: LICENSE
        buildPhase: resources
      - path: Credits.rtf
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: IronTV
        CFBundleDisplayName: IronTV
        CFBundleShortVersionString: "0.1.7"
        CFBundleVersion: "8"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar. All rights reserved."
        LSApplicationCategoryType: public.app-category.video
        NSAppTransportSecurity:
          # Provider host is entered by the user at runtime, so a per-host
          # ATS exception is impossible. IPTV panels serve plain HTTP.
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Sources/IronTV.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantkernel.irontv
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          # Distribution builds: Developer ID + secure timestamp (required
          # for notarization). Debug keeps the Apple Development identity.
          # macOS-only settings — Developer ID does not exist on iOS/tvOS.
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Don't inject the get-task-allow debug entitlement — notarization
          # rejects executables that request it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
    scheme:
      testTargets:
        - IronTVTests
  IronTV-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          - "*.entitlements"
      - path: LICENSE
        buildPhase: resources
    info:
      path: Sources/Info-iOS.plist
      properties:
        CFBundleName: IronTV
        CFBundleDisplayName: IronTV
        CFBundleShortVersionString: "0.1.7"
        CFBundleVersion: "8"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar. All rights reserved."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantkernel.irontv
        PRODUCT_NAME: IronTV
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  IronTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          - "*.entitlements"
      - path: LICENSE
        buildPhase: resources
    info:
      path: Sources/Info-tvOS.plist
      properties:
        CFBundleName: IronTV
        CFBundleDisplayName: IronTV
        CFBundleShortVersionString: "0.1.7"
        CFBundleVersion: "8"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar. All rights reserved."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantkernel.irontv
        PRODUCT_NAME: IronTV
        TARGETED_DEVICE_FAMILY: "3"
  IronTVTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IronTVTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: IronTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantkernel.irontv.tests
        GENERATE_INFOPLIST_FILE: true
