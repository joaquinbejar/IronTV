name: IronTV
options:
  bundleIdPrefix: com.taunais
  # Base language of Sources/Localizable.xcstrings; translations (es) ship
  # from the same catalog.
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  # VLC fallback decoder for channels AVPlayer can't play on iOS/tvOS
  # (MP2 audio, interlaced video). Binary SPM wrapper of official VLCKit.
  #
  # Pinned to an exact version, not a `from:` range. This is a *binary* LGPL
  # dependency that ships inside the app, so a clean checkout resolving a
  # different build would change what we distribute without review. The
  # generated .xcodeproj — and with it Package.resolved — is gitignored, so
  # this line is the only reproducibility anchor there is. Bumping it is a
  # deliberate, reviewed change: see "Dependencies" in README.md.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: "3.6.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Swift 6 language mode makes complete concurrency checking part of the
    # language — isolation violations are compile errors now, not warnings.
    # The explicit setting stays as documentation of intent (and as the
    # safety net if SWIFT_VERSION is ever rolled back): the isolation model
    # (@MainActor view models, Sendable stores, TeardownBag-owned observer
    # lifecycles) is load-bearing. Keep the build at zero warnings.
    SWIFT_STRICT_CONCURRENCY: complete
    # App Store distribution on all platforms. Automatic signing lets Xcode
    # pick Apple Development for Debug and Apple Distribution for archives.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5NP3LPSUMR
targets:
  IronTV:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          - "*.entitlements"
      - path: LICENSE
        buildPhase: resources
      - path: Credits.rtf
        buildPhase: resources
    dependencies:
      - package: VLCKitSPM
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: IronTV
        CFBundleDisplayName: IronTV
        # Mirrors favorites/last channel/playback settings via iCloud KVS.
        IronTVCloudKVSEnabled: true
        CFBundleShortVersionString: "1.1.2"
        CFBundleVersion: "19"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar. All rights reserved."
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.video
        NSAppTransportSecurity:
          # Provider host is entered by the user at runtime, so a per-host
          # ATS exception is impossible. IPTV panels serve plain HTTP.
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Sources/IronTV.entitlements
      properties:
        # App Sandbox is mandatory for the Mac App Store. network.client
        # allows outgoing connections to the IPTV server and sample streams.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Opts the app into the data-protection Keychain (see KeychainStore).
        # The legacy file-based login Keychain binds items to an ACL owned by
        # the signature that created them, so a differently-signed build hits
        # errSecInvalidOwnerEdit (-25244) when overwriting the account.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.taunais.irontv
        # iCloud key-value store: favorites, last channel and playback
        # settings follow the user across devices (see SyncedStorage).
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.irontv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - IronTVTests
  IronTV-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          - "*.entitlements"
      - path: LICENSE
        buildPhase: resources
    info:
      path: Sources/Info-iOS.plist
      properties:
        CFBundleName: IronTV
        CFBundleDisplayName: IronTV
        # Mirrors favorites/last channel/playback settings via iCloud KVS.
        IronTVCloudKVSEnabled: true
        CFBundleShortVersionString: "1.1.2"
        CFBundleVersion: "19"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar. All rights reserved."
        ITSAppUsesNonExemptEncryption: false
        # Single playback scene: every window is a provider connection slot
        # (issue #10). macOS enforces this with a unique Window scene.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: VLCKitSPM
    entitlements:
      path: Sources/IronTV-iOS.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.irontv
        PRODUCT_NAME: IronTV
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Xcode manages iOS provisioning profiles (device installs) itself.
        CODE_SIGN_STYLE: Automatic
  IronTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
        excludes:
          - "Info*.plist"
          - "*.entitlements"
      - path: LICENSE
        buildPhase: resources
    info:
      path: Sources/Info-tvOS.plist
      properties:
        CFBundleName: IronTV
        CFBundleDisplayName: IronTV
        IronTVCloudKVSEnabled: true
        CFBundleShortVersionString: "1.1.2"
        CFBundleVersion: "19"
        NSHumanReadableCopyright: "© 2026 Joaquin Bejar. All rights reserved."
        ITSAppUsesNonExemptEncryption: false
        # Single playback scene, same policy as iOS (issue #10).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    dependencies:
      - package: VLCKitSPM
    entitlements:
      path: Sources/IronTV-tvOS.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.irontv
        PRODUCT_NAME: IronTV
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  IronTVTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IronTVTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: IronTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taunais.irontv.tests
        GENERATE_INFOPLIST_FILE: true
