name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The project is generated from project.yml; the .xcodeproj is not in git.
  PROJECT: IronTV.xcodeproj
  # CI has no Apple account, so -allowProvisioningUpdates is unavailable.
  #
  # The macOS target declares a *restricted* keychain-access-groups entitlement.
  # A build that carries it without an embedded provisioning profile is SIGKILLed
  # by AMFI at launch, which would kill the XCTest host before a single test ran.
  # So: ad-hoc sign (arm64 binaries must be signed at all to launch) and drop the
  # entitlements file. No test touches the real Keychain — the stores are behind
  # injectable seams — so nothing under test needs it.
  SIGNING_FOR_TESTS: >-
    CODE_SIGN_IDENTITY=-
    CODE_SIGN_ENTITLEMENTS=
    CODE_SIGN_STYLE=Manual
    PROVISIONING_PROFILE_SPECIFIER=
    DEVELOPMENT_TEAM=
  # Simulator builds never launch, so they need no signature at all.
  SIGNING_FOR_BUILDS: >-
    CODE_SIGNING_ALLOWED=NO
    CODE_SIGNING_REQUIRED=NO
    CODE_SIGN_IDENTITY=
    CODE_SIGN_ENTITLEMENTS=
    DEVELOPMENT_TEAM=

jobs:
  macos-test:
    name: macOS build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-project
      - name: Build
        run: |
          read -ra signing <<< "$SIGNING_FOR_TESTS"
          xcodebuild -project "$PROJECT" -scheme IronTV -configuration Debug \
            -destination 'platform=macOS' "${signing[@]}" build
      - name: Test
        run: |
          read -ra signing <<< "$SIGNING_FOR_TESTS"
          xcodebuild -project "$PROJECT" -scheme IronTV \
            -destination 'platform=macOS' "${signing[@]}" test

  ios-build:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-project
      - name: Build
        run: |
          read -ra signing <<< "$SIGNING_FOR_BUILDS"
          xcodebuild -project "$PROJECT" -scheme IronTV-iOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' "${signing[@]}" build

  tvos-build:
    name: tvOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-project
      - name: Build
        run: |
          read -ra signing <<< "$SIGNING_FOR_BUILDS"
          xcodebuild -project "$PROJECT" -scheme IronTV-tvOS -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' "${signing[@]}" build

  strict-concurrency:
    name: Strict concurrency
    runs-on: macos-15
    # Since #38 the project builds in the Swift 6 language mode, where
    # isolation violations are compile errors — the macOS build & test job
    # above would already fail on them. This job stays as the zero-warning
    # witness over the test sources too (build-for-testing): any warning in
    # a file under this repo fails it, so deprecations and new-toolchain
    # diagnostics can't accumulate silently. SDK and dependency noise does
    # not count. The explicit SWIFT_STRICT_CONCURRENCY=complete is redundant
    # in Swift 6 mode but harmless, and keeps the job meaningful if
    # SWIFT_VERSION is ever rolled back.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-project
      - name: Build app + tests with complete checking, zero project warnings
        run: |
          set -o pipefail
          read -ra signing <<< "$SIGNING_FOR_TESTS"
          xcodebuild -project "$PROJECT" -scheme IronTV -configuration Debug \
            -destination 'platform=macOS' "${signing[@]}" \
            SWIFT_STRICT_CONCURRENCY=complete build-for-testing 2>&1 | tee strict.log
          grep 'warning:' strict.log | grep -F "$PWD" | sort -u > project-warnings.txt || true
          count=$(wc -l < project-warnings.txt | tr -d ' ')
          {
            echo "### Strict concurrency"
            echo "\`SWIFT_STRICT_CONCURRENCY=complete\` produced **$count** project warnings (gate: zero)."
            if [ "$count" -gt 0 ]; then
              echo ""
              echo '```'
              cat project-warnings.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "Project warnings under strict concurrency (these become Swift 6 errors):"
            cat project-warnings.txt
            exit 1
          fi

  newest-toolchain:
    name: Newest toolchain (informational)
    runs-on: macos-latest
    # macos-latest moves when GitHub promotes a new image. Keeping it informational
    # means a new Xcode surfaces here as a warning instead of turning every PR red,
    # while macos-15 above stays the reproducible, blockable gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-project
      - name: Build & test
        run: |
          read -ra signing <<< "$SIGNING_FOR_TESTS"
          xcodebuild -project "$PROJECT" -scheme IronTV \
            -destination 'platform=macOS' "${signing[@]}" test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files for credentials
        run: scripts/secret-scan.sh

  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest
    # README.md is the authoritative app description (issue #22). This gate
    # fails when it, CLAUDE.md, or SPEC.md contradict project.yml on platform
    # minimums, bundle id, or Swift version — the facts that rot silently.
    steps:
      - uses: actions/checkout@v4
      - name: Check docs agree with project.yml
        run: scripts/check-docs-drift.sh
